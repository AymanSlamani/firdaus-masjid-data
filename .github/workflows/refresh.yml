name: Refresh public mosque data
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Refresh OpenStreetMap, eSalah enrichment and website discovery too
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/**', 'requirements.txt', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: mosque-data-refresh
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=scripts python -c "from masjid_data.validate import validate_catalog; validate_catalog('catalog/us.json')"
  refresh:
    if: github.event_name != 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: .tools/masjid-data
          key: mosque-import-${{ runner.os }}-${{ github.run_id }}
          restore-keys: mosque-import-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Refresh and validate before publishing
        env:
          FULL_REFRESH: ${{ inputs.full }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$FULL_REFRESH" = "true" ] || { [ "$SCHEDULED" = "true" ] && [ "$(date -u +%u)" = "7" ]; }; then
            python scripts/run-masjid-feed-refresh.py --full
          else
            python scripts/run-masjid-feed-refresh.py
          fi
      - name: Publish the completed snapshot
        run: |
          git config user.name 'Firdaus data refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog inputs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh attributed U.S. mosque directory and dated schedules'
          git push origin HEAD:main
